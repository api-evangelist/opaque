apis:
- name: OPAQUE Platform REST API
  description: 'REST API exposed by the OPAQUE client / API pod for the Confidential AI Platform.
    Covers workspaces, datasets and data upload from AWS S3 / Azure Blob / Azure Files / Google
    Cloud Storage, analytics and notebook jobs, job runs, results and logs, agentic workflows
    (create, review, launch, stop), asset configurations, predefined and pinned queries, users,
    and organization membership. Requests and responses are JSON; authentication is by session
    token (JWT bearer, 10-minute lifetime), a refresh-token cookie, and a user identity secret
    cookie for cryptographic/sensitive operations. Because OPAQUE runs the API pod inside the
    customer environment, the base URL is per-deployment and follows the documented pattern
    https://api.<your-subdomain>/<version>.'
  humanURL: https://docs.opaque.co/en/latest/api_reference/rest_api/
  baseURL: https://api.<your-subdomain>/v2.5
  tags:
  - confidential-computing
  - confidential-ai
  - agentic-workflows
  - secure-analytics
  - attestation
  - workflows
  - jobs
  - datasets
  properties:
