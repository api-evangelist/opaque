  - type: ErrorCatalog
    url: errors/opaque-problem-types.yml
  - type: DataModel
    url: data-model/opaque-data-model.yml
  - type: Overlay
    url: overlays/opaque-platform-api-overlay.yaml
x-notes:
- 'baseURL is the per-deployment pattern OPAQUE publishes, not a shared production host. OPAQUE
  ships a hybrid architecture in which the web UI and REST API are served from inside the
  customer''s own environment (docs.opaque.co/en/latest/public_guide/deployment/hybrid_deployment/),
  and the docs give the production form as https://api.{your-subdomain}/v2.5. The harvested
  OpenAPI declares only http://localhost:5001/ as its server, which is the local development
  server. No shared public API host exists to substitute; nothing was invented here.'
