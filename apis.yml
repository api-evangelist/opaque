aid: opaque
name: OPAQUE
description: 'OPAQUE Systems, Inc. is a confidential-AI platform company that lets enterprises
  run AI and analytics on their most sensitive data without exposing it. The OPAQUE Confidential
  AI Platform executes agentic workflows, retrieval-augmented generation, and analytics jobs
  inside hardware trusted execution environments (TEEs), with attested TLS between components,
  signed attestation reports, and tamper-evident audit logs so every run can be independently
  verified. It is deployed in a hybrid architecture: an OPAQUE-hosted control plane manages users,
  workspaces, job metadata, notifications, audit logging, and key management, while the data plane,
  client/API pod, and encrypted storage all run inside the customer''s own cloud environment. The
  platform exposes a documented REST API (workspaces, datasets, jobs, workflows, asset configs,
  users, organizations) described by an OpenAPI 3.0.3 specification, plus a Python SDK for invoking
  deployed workflows. It is used in insurance, financial services, and high-tech for confidential
  RAG, secure multi-party analytics, and governed agent execution.'
