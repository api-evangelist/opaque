    URL.
- source: https://docs.opaque.co/en/latest/public_guide/users/workflows/using_integrations/
  finding: In the product, MCP appears as the "MCP Tool" node — a generic interface for an Agent node
    in tool mode to invoke EXTERNAL MCP tools, with runtime context mapping onto parameters read from
    the target tool's OpenAPI spec. OPAQUE is an MCP consumer and governor, not an MCP provider.
