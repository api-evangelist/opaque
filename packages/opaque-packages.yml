packages:
- language: python
  name: opaque
  registry: none
  distribution: private ZIP archive supplied by OPAQUE, version-matched to the deployment
  install: unzip opaque-python-package.zip && pip install opaque-<OPAQUE_VERSION>.tar.gz
  import: from opaque.workflow import WorkflowService
  requires: Python 3.10+
  url: https://docs.opaque.co/en/latest/public_guide/users/workflows/environment_setup/
  reference: https://docs.opaque.co/en/latest/api_reference/python_sdk_reference/
  official: true
  public: false
  note: >-
    The current OPAQUE Python SDK is NOT published to PyPI. The docs instruct customers to obtain
    a ZIP file from their OPAQUE contact matching their deployment version. The PyPI project named
    `opaque` is a different, unrelated library. This is the single largest developer-experience
    gap in OPAQUE's surface: a documented, version-pinned SDK that no one outside a customer
    account can install.
