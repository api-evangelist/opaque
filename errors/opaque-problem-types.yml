format: rfc7807-shaped
envelope:
  media_type: application/json
  note: >-
    OPAQUE returns an error object whose field names match RFC 7807 / RFC 9457 Problem Details
    (type, title, status, detail), but it is served as application/json rather than
    application/problem+json, and `type` carries either the literal "about:blank" or the token
    "exception" rather than a dereferenceable problem-type URI. Documented as "Error responses"
    in the response codes and errors reference.
  fields:
  - name: detail
    type: string
    description: A detailed explanation of the error.
  - name: status
    type: integer
    description: The corresponding HTTP status code.
  - name: title
    type: string
    description: A short, human-readable summary of the error.
  - name: type
    type: string
    description: The type or category of error (observed values - "about:blank", "exception").
