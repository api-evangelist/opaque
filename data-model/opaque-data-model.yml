notes:
- The `components.schemas` block of the OpenAPI is a set of external $refs to
  ../models/*.yaml. Those documents are published and fetchable (all 200) and have been harvested
  verbatim into json-schema/, but the spec as published does not resolve standalone — a consumer
  fetching only Opaque-UI.yaml gets seven unresolvable $refs. Bundling the models into the spec
  is a one-line publishing fix worth more than anything else on the contract.
- The Stoplight x-stoplight ids and x-faker/x-go-type extensions in the models show the spec is
  authored in Stoplight and used to generate mocks and Go types.
