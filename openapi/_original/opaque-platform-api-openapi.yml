---
openapi: 3.0.3
info:
  title: Opaque UI
  version: '2.5'  # Be sure to also update OPAQUE_API_VERSION in ".env" so frontend uses the correct API version.
  description: This documentation details the REST API endpoints that the client exposes.
  contact:
    name: Opaque Systems
    email: hello@opaque.co
servers:
  - url: http://localhost:5001/
    description: Local Server
tags:
  - name: auth
    description: Authentication
  - name: users
    description: Users
  - name: Azure
    description: Azure Authentication
  - name: workspaces
    description: Workspaces
  - name: datasets
    description: Data & Datum
  - name: jobs
    description: Jobs
  - name: asset-configs
    description: Asset Configurations
paths:
  /{version}/workspaces:
    get:
      summary: Get all workspaces
      tags:
        - workspaces
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ../models/Workspace.yaml
      operationId: get_workspaces
      parameters:
        - schema:
            type: string
            enum:
              - accepted
              - invited
          in: query
          name: inviteStatus
          description: filter workspaces returned based on user's inviteStatus
        - schema:
            type: boolean
          in: query
          name: archived
          description: filter workspaces returned based on whether workspace is archived.
            If not provided there will be no filtering.
      description: |-
        Get a list of all workspaces the user has access to.
        This list includes workspaces the user has been invited to,
        accepted invites for, or has created themselves.
    parameters:
      - $ref: '#/components/parameters/version'
  /{version}/workspace:
    parameters:
      - $ref: '#/components/parameters/version'
    post:
      summary: Create workspace
      operationId: create_workspace
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/Workspace.yaml
        '400':
          description: |-
            Bad Request
            - One or more members do not exist
            - Workspace name does not match required format
          content:
            application/json:
              schema:
                $ref: ../models/Error.yaml
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Workspace name
                  minLength: 1
                  maxLength: 50
                type:
                  type: string
                  description: Workspace type
                  enum:
                    - analytics
                    - agentic
                members:
                  type: array
                  description: Defaults to a one-item array with creator's email if
                    not provided
                  items:
                    type: string
                    format: email
                predefinedQueryTemplates:
                  type: array
                  items:
                    type: string
                  description: Templates that are available to users inside the workspace
                policy:
                  $ref: ../models/WorkspacePolicy.yaml
                description:
                  type: string
                  description: Description of the workspace
                  maxLength: 150
              required:
                - name
                - type
      description: Create a new workspace.
      tags:
        - workspaces
      security:
        - userIdentitySecret: []
          sessionToken: []
          refreshTokenCookie: []
  /{version}/workspace/{workspace-uuid}:
    get:
      summary: Get workspace
      tags:
        - workspaces
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/Workspace.yaml
      operationId: get_workspace
      parameters: []
      description: Get a single workspace matching the UUID.
    parameters:
      - schema:
          type: string
        name: workspace-uuid
        in: path
        required: true
      - $ref: '#/components/parameters/version'
    patch:
      summary: Update Workspace
      operationId: update_workspace
      tags:
        - workspaces
      responses:
        '200':
          description: OK
      description: Update the workspace. Can only be called by the workspace's creator.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                archived:
                  type: boolean
                  x-stoplight:
                    id: mnnksbwlaqrwa
                  description: If set to true, archives the workspace
                predefinedQueryTemplates:
                  type: array
                  items:
                    type: string
                  description: Sets the templates that are available to users inside
                    the workspace
                description:
                  type: string
                  description: The new description of the workspace
  /{version}/workspace/{workspace-uuid}/invite:
    parameters:
      - $ref: '#/components/parameters/version'
      - schema:
          type: string
        name: workspace-uuid
        in: path
        required: true
    post:
      summary: Decide workspace invite
      operationId: respond_workspace_invite
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/Workspace.yaml
        '400':
          description: |-
            Bad Request
            - Already responded to invite
            - inviteStatus must be accepted or rejected
          content:
            application/json:
              schema:
                $ref: ../models/Error.yaml
      description: Accept or decline an invite to a workspace.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                inviteStatus:
                  type: string
                  enum:
                    - accepted
                    - rejected
              required:
                - inviteStatus
      tags:
        - workspaces
      security:
        - userIdentitySecret: []
          sessionToken: []
          refreshTokenCookie: []
  /{version}/workspace/{workspace-uuid}/data:
    parameters:
      - $ref: '#/components/parameters/version'
      - schema:
          type: string
        name: workspace-uuid
        in: path
        required: true
    get:
      summary: Get data for workspace
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ../models/Datum.yaml
      operationId: get_data_by_workspace
      description: |-
        Get a list of all datum matching the workspace UUID.
        `conditions` and `conditionDropdowns` will be **null** in objects where the user is not the creator.
      tags:
        - datasets
    delete:
      summary: Remove data from workspace
      tags:
        - datasets
      parameters:
        - schema:
            type: string
          name: dataset-path
          in: query
          required: true
        - schema:
            type: string
          name: data-store-config-uuid
          in: query
          required: true
      responses:
        '204':
          description: No Content
      operationId: remove_workspace_data
  /{version}/datum/{datum-uuid}:
    get:
      summary: Get datum
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/Datum.yaml
      operationId: get_datum
      description: |-
        Get a datum.
        `conditions` and `conditionDropdowns` will be **null** if the user is not the creator.
      tags:
        - datasets
    parameters:
      - schema:
          type: string
        name: datum-uuid
        in: path
        required: true
      - $ref: '#/components/parameters/version'
    delete:
      summary: Delete datum
      operationId: delete_datum
      responses:
        '204':
          description: No Content
        '500':
          description: |-
            Internal Server Error
            - Provider deletion failed
          content:
            application/json:
              schema:
                $ref: ../models/Error.yaml
      tags:
        - datasets
      description: Delete the datum with the provided id
    patch:
      summary: Update data in workspace
      tags:
        - datasets
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/Datum.yaml
      operationId: update_workspace_data
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  x-stoplight:
                    id: lj7wjfrbrvoe4
  /{version}/workspace/{workspace-uuid}/jobs:
    get:
      summary: Get jobs
      tags:
        - jobs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ../models/Job.yaml
      operationId: get_jobs_by_workspace
      description: Get a list of all jobs in the workspace.
      parameters:
        - schema:
            type: string
            enum:
              - python
              - predefined
          in: query
          name: queryType
          allowEmptyValue: true
          description: Type of job to fetch
        - schema:
            type: boolean
          in: query
          name: archived
          description: filter jobs returned based on whether job is archived. If not
            provided there will be no filtering.
    parameters:
      - schema:
          type: string
        name: workspace-uuid
        in: path
        required: true
      - $ref: '#/components/parameters/version'
  /{version}/workspace/{workspace-uuid}/job:
    parameters:
      - schema:
          type: string
        name: workspace-uuid
        in: path
        required: true
      - $ref: '#/components/parameters/version'
    post:
      summary: Create job
      operationId: create_job
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/Job.yaml
        '400':
          description: |-
            Bad Request
            - Invalid workspace status
            - Invalid body parameter
          content:
            application/json:
              schema:
                $ref: ../models/Error.yaml
      tags:
        - jobs
      description: |-
        Create a new job in draft status.
        A new job is filled with defaults.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  default: New Job
                  maxLength: 50
                queryType:
                  x-stoplight:
                    id: mx3g80igdq964
                  type: string
                  enum:
                    - python
                    - predefined
                  default: python
                repeatable:
                  type: boolean
                  default: false
                description:
                  type: string
                  maxLength: 150
              required:
                - name
  /{version}/workspace/{workspace-uuid}/workflow:
    parameters:
      - schema:
          type: string
        name: workspace-uuid
        in: path
        required: true
        description: Workspace UUID
      - $ref: '#/components/parameters/version'
    post:
      summary: Create workflow
      tags:
        - workflows
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                endpointPrefix:
                  type: string
                  description: Prefix for the workflow endpoint
                workflowGraph:
                  type: object
                  description: JSON object that stores the structure and configuration of the workflow
                  x-python-type: Dict[str, object]
                  additionalProperties: true
                uiDefinition:
                  type: object
                  description: JSON object that can be used to store UI-specific information about the workflow
                  x-python-type: Dict[str, object]
                  additionalProperties: true
              required:
                - name
                - workflowGraph
                - uiDefinition
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/Workflow.yaml
      operationId: create_workflow
      description: Create a new workflow
  /{version}/workflow/{workflow-uuid}:
    parameters:
      - schema:
          type: string
        name: workflow-uuid
        in: path
        required: true
        description: Workflow UUID
      - $ref: '#/components/parameters/version'
    get:
      summary: Get workflow
      tags:
        - workflows
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/Workflow.yaml
      operationId: get_workflow
      description: Get a workflow by UUID
    patch:
      summary: Update workflow
      operationId: update_workflow
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/Workflow.yaml
        '400':
          description: |-
            Bad Request
            - Invalid workflow status
            - Invalid body parameter
          content:
            application/json:
              schema:
                $ref: ../models/Error.yaml
      tags:
        - workflows
      description: |-
        Update the workflow with one or more of the provided values.
        Can only be called by the workflow's creator or an admin.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: New name for the workflow
                description:
                  type: string
                  description: New description for the workflow
                endpointPrefix:
                  type: string
                  description: New prefix for the workflow endpoint
                workflowGraph:
                  type: object
                  description: New JSON object that stores the structure and configuration of the workflow. Required if status is "under review".
                  x-python-type: Dict[str, object]
                  additionalProperties: true
                uiDefinition:
                  type: object
                  description: New JSON object that can be used to store UI-specific information about the workflow
                  x-python-type: Dict[str, object]
                  additionalProperties: true
    delete:
      summary: Delete workflow
      operationId: delete_workflow
      responses:
        '204':
          description: No Content
        '400':
          description: |-
            Bad Request
            - Workflow cannot be deleted (not in DRAFT status)
          content:
            application/json:
              schema:
                $ref: ../models/Error.yaml
      tags:
        - workflows
      description: Delete a workflow by UUID. Only works if the workflow is in the DRAFT state.
  /{version}/workflow/{workflow-uuid}/request-review:
    parameters:
      - schema:
          type: string
        name: workflow-uuid
        in: path
        required: true
        description: Workflow UUID
      - $ref: '#/components/parameters/version'
    post:
      summary: Request workflow review
      operationId: request_workflow_review
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/Workflow.yaml
        '400':
          description: |-
            Bad Request
            - Invalid workflow graph
          content:
            application/json:
              schema:
                $ref: ../models/Error.yaml
      description: |-
        Request a review for a workflow. A workflow graph must also be provided to be compared against the existing workflow graph for security purposes.
      tags:
        - workflows
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                workflowGraph:
                  type: object
                  description: JSON object that stores the structure and configuration of the workflow to be reviewed. Will be compared against the existing workflow graph and an error will be thrown if they do not match.
                  x-python-type: Dict[str, object]
                  additionalProperties: true
              required:
                - workflowGraph
      security:
        - sessionToken: []
          refreshTokenCookie: []
          userIdentitySecret: []
  /{version}/workflow/{workflow-uuid}/cancel-review:
    parameters:
      - schema:
          type: string
        name: workflow-uuid
        in: path
        required: true
        description: Workflow UUID
      - $ref: '#/components/parameters/version'
    post:
      summary: Canel workflow review
      operationId: cancel_workflow_review
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/Workflow.yaml
      description: |-
        Cancel workflow reivew and set back the status to draft.
      tags:
        - workflows
  /{version}/workflow/{workflow-uuid}/review:
    parameters:
      - schema:
          type: string
        name: workflow-uuid
        in: path
        required: true
        description: Workflow UUID
      - $ref: '#/components/parameters/version'
    post:
      summary: Review workflow
      operationId: review_workflow
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/WorkflowReview.yaml
        '400':
          description: |-
            Bad Request
            - Workflow status must be **under review**
          content:
            application/json:
              schema:
                $ref: ../models/Error.yaml
      description: |-
          Review a workflow.
      tags:
        - workflows
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                decision:
                  type: string
                  enum:
                    - accepted
                    - rejected
                comment:
                  type: string
                workflowGraph:
                  type: object
                  description: New JSON object that stores the structure and configuration of the workflow. Required if status is "under review".
                  x-python-type: Dict[str, object]
                  additionalProperties: true
              required:
                - decision
                - workflowGraph
      security:
        - userIdentitySecret: []
          sessionToken: []
          refreshTokenCookie: []
  /{version}/workflow/{workflow-uuid}/reviews:
    parameters:
      - schema:
          type: string
        name: workflow-uuid
        in: path
        required: true
        description: Workflow UUID
      - $ref: '#/components/parameters/version'
    get:
      summary: Get workflow reviews
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ../models/WorkflowReview.yaml
      operationId: get_workflow_reviews
      description: Returns all the reviews for a workflow, ordered by creation descending.
      tags:
        - workflows
  /{version}/workflow/{workflow-uuid}/launch-workflow:
    parameters:
      - schema:
          type: string
        name: workflow-uuid
        in: path
        required: true
        description: Workflow UUID
      - $ref: '#/components/parameters/version'
    post:
      summary: Launch workflow
      tags:
        - workflows
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/Workflow.yaml
      operationId: launch_workflow
      description: launch a workflow by UUID
  /{version}/workflow/{workflow-uuid}/stop-workflow:
    parameters:
      - schema:
          type: string
        name: workflow-uuid
        in: path
        required: true
        description: Workflow UUID
      - $ref: '#/components/parameters/version'
    post:
      summary: Stop or shutdown workflow
      tags:
        - workflows
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/Workflow.yaml
      operationId: shutdown_workflow
      description: stop or shutdown a workflow by UUID
  /{version}/workspace/{workspace-uuid}/workflows:
    parameters:
      - schema:
          type: string
        name: workspace-uuid
        in: path
        required: true
        description: Workspace UUID
      - $ref: '#/components/parameters/version'
    get:
      summary: Get workspace workflows
      tags:
        - workflows
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ../models/SimpleWorkflow.yaml
      operationId: get_workspace_workflows
      description: Get all metadata about all workflows associated with a workspace
  /{version}/job/{job-uuid}:
    get:
      summary: Get job metadata
      tags:
        - jobs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/Job.yaml
      operationId: get_job
      description: Get the job with the provided UUID.
    parameters:
      - schema:
          type: string
        name: job-uuid
        in: path
        required: true
      - $ref: '#/components/parameters/version'
    patch:
      summary: Update job
      operationId: update_job
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/Job.yaml
        '201':
          description: Created
        '400':
          description: |-
            Bad Request
            - Job cannot be modified after it is queued
          content:
            application/json:
              schema:
                $ref: ../models/Error.yaml
      tags:
        - jobs
      description: |-
        Update the job with one or more of the provided values.
        Updating repeatability or inputVariables only works in draft state
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                status:
                  type: string
                  enum:
                    - under review
                    - draft
                repeatable:
                  type: boolean
                archived:
                  type: boolean
                description:
                  type: string
            examples:
              Update job and submit for review:
                value:
                  name: Job 1
                  description: Example description
                  status: under review
        description: ''
      security:
        - userIdentitySecret: []
          sessionToken: []
          refreshTokenCookie: []
    delete:
      summary: Delete job
      operationId: delete_job
      responses:
        '204':
          description: No Content
        '400':
          description: |-
            Bad Request
            - Job cannot be deleted after a run has been submitted
          content:
            application/json:
              schema:
                $ref: ../models/Error.yaml
      tags:
        - jobs
      description: Delete the job, only if there are no submitted JobRuns associated
        with the Job
      security:
        - userIdentitySecret: []
          sessionToken: []
          refreshTokenCookie: []
  /{version}/job/{job-uuid}/input-variable:
    parameters:
      - schema:
          type: string
        name: job-uuid
        in: path
        required: true
      - $ref: '#/components/parameters/version'
    post:
      summary: Create job input_variable
      operationId: create_job_input_variable
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/JobInputVariable.yaml
        '400':
          description: |-
            Bad Request
            - Job status must be **draft**
          content:
            application/json:
              schema:
                $ref: ../models/Error.yaml
      description: |-
        Create a new input variable for a job
      tags:
        - jobs
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                type:
                  $ref: ../models/JobInputVariableType.yaml
                constraints:
                  $ref: ../models/JobInputVariableConstraintScaffolding/ConstraintOrBlock.yaml
                description:
                  type: string
                  default: ''
                default:
                  type: string
              required:
                - name
                - type
  /{version}/input-variable/{input-variable-uuid}:
    parameters:
      - schema:
          type: string
        name: input-variable-uuid
        in: path
        required: true
      - $ref: '#/components/parameters/version'
    patch:
      summary: Update job input_variable
      operationId: update_job_input_variable
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/JobInputVariable.yaml
        '400':
          description: |-
            Bad Request
            - Job status must be **draft**
          content:
            application/json:
              schema:
                $ref: ../models/Error.yaml
      description: |-
        Update an existing input variable for a job
      tags:
        - jobs
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                type:
                  $ref: ../models/JobInputVariableType.yaml
                description:
                  type: string
                default:
                  type: string
                clearDefault:
                  type: boolean
                  description: Clears the default value, marking the variable as required
                constraints:
                  $ref: ../models/JobInputVariableConstraintScaffolding/ConstraintOrBlock.yaml
    delete:
      summary: Remove job input_variable
      operationId: delete_job_input_variable
      responses:
        '204':
          description: No Content
        '400':
          description: |-
            Bad Request
            - Job status must be **draft**
          content:
            application/json:
              schema:
                $ref: ../models/Error.yaml
      description: |-
        Deletes an existing input variable for a job
      tags:
        - jobs
  /{version}/job/{job-uuid}/review:
    parameters:
      - schema:
          type: string
        name: job-uuid
        in: path
        required: true
      - $ref: '#/components/parameters/version'
    patch:
      summary: Update job review
      operationId: review_job
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/JobReview.yaml
        '400':
          description: |-
            Bad Request
            - Decision is **rejected** but no comment was provided
            - Job status must be **under review**
          content:
            application/json:
              schema:
                $ref: ../models/Error.yaml
      description: |-
        Update a review on the job.
        Must provide a comment if `decision` is `rejected`.
      tags:
        - jobs
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                decision:
                  type: string
                  enum:
                    - accepted
                    - rejected
                comment:
                  type: string
        description: ''
      security:
        - userIdentitySecret: []
          sessionToken: []
          refreshTokenCookie: []
  /{version}/job/{job-uuid}/job-run:
    parameters:
      - schema:
          type: string
        name: job-uuid
        in: path
        required: true
      - $ref: '#/components/parameters/version'
    post:
      summary: Create Job Run
      operationId: create_job_run
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/JobRun.yaml
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                inputValues:
                  type: array
                  items:
                    $ref: ../models/JobInputValue.yaml
                testRun:
                  type: boolean
                  default: false
