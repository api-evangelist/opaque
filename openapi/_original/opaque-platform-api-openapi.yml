components:
  parameters:
    version:
      in: path
      name: version
      schema:
        type: string
        default: v1.2
        example: v1.2
      description: Version of the API to call
      required: true
    Set-sessionTokenCookie:
      name: Set-Cookie
      in: header
      required: false
      schema:
        type: string
      description: Set the sessionTokenCookie cookie to the value of sessionToken.
    Set-userIdentitySecret-Cookie:
      name: Set-userIdentitySecret Cookie
      in: header
      required: false
      schema:
        type: string
      description: Set the userIdentitySecret cookie to the value of userIdentitySecret.
    AssetConfigTypeParam:
      name: assetType
      in: query
      required: false
      schema:
        $ref: ../models/AssetConfigType.yaml
      description: Filter asset configs by asset type
  schemas:
    User:
      $ref: ../models/User.yaml
    Workspace:
      $ref: ../models/Workspace.yaml
    Datum:
      $ref: ../models/Datum.yaml
    Job:
      $ref: ../models/Job.yaml
    OrganizationData:
      $ref: ../models/OrganizationData.yaml
    AssetConfig:
      $ref: ../models/AssetConfig.yaml
    SimpleAssetConfig:
      $ref: ../models/SimpleAssetConfig.yaml
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: The bearer token is obtained from the `/login` and `/register`
        endpoints.
    userIdentitySecret:
      name: userIdentitySecret
      type: apiKey
      in: cookie
      description: A binary blob derived from a user's passkey. It can be obtained
        from the `/login` and `/register` endpoints.
    sessionTokenCookie:
      name: sessionTokenCookie
      type: apiKey
      in: cookie
    refreshTokenCookie:
      name: refreshTokenCookie
      type: apiKey
      in: cookie
  requestBodies: {}
  responses: {}
x-origin: origin
x-extension-with: x-extension-with
security:
  - sessionToken: []
    refreshTokenCookie: []
