method: searched
source: https://docs.opaque.co/en/latest/public_guide/users/admins/versioning/
versioning:
  scheme: uri-path
  current: v2.5
  platform_version: 2.7.0
  semver: true
  rules:
  - Major updates introduce breaking changes.
  - Minor updates add new features in a backward-compatible way.
  - Patch updates provide backward-compatible bug fixes.
  docs: https://docs.opaque.co/en/latest/public_guide/users/admins/versioning/
  note: >-
    The platform comprises independently versioned components. A workspace exposes a
    "compatible OPAQUE version" — the lowest common version among all member organizations —
    and only features supported across all members are available in a multiparty workspace.
    All workspace members must run the same major version to collaborate. The OpenAPI info.version
    is 2.5 and the API version is carried as a {version} path parameter.
  sdk_pinning: >-
    The Python SDK must match the deployment version; OPAQUE distributes a version-matched ZIP
    (pip install opaque-<OPAQUE_VERSION>.tar.gz).
release_notes: https://docs.opaque.co/en/latest/release_notes/
deprecation:
  policy_url: null
  sunset_header: false
  evidence: >-
