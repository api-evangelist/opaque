---
title: OrganizationData
type: object
properties:
  uuid:
    type: string
    x-faker: datatype.uuid
  name:
    type: string
    description: Name of the dataset
    x-faker: commerce.product
  datasetPath:
    type: string
    description: Path to the dataset, including any directories
    x-faker: commerce.product
  remoteUri:
    type: string
    format: uri
    description: Exact Azure path a user will need to type into a query to access this data
    x-faker: system.filePath
  createdAt:
    type: string
    format: date-time
    description: ISO 8601 string
    example: '2019-01-25T02:00:00.000Z'
    x-faker: date.recent
  createdBy:
    $ref: ./User.yaml
  columns:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
      required:
        - name
        - type
  dataSource:
    type: string
    enum:
      - local
      - aws_s3
      - azure_blob
      - azure_file
      - gcp
      - job_run_result
  description:
    type: string
    description: A description of the data
  size:
    type: number
    description: The size in bytes of the data
  testDataType:
    type: string
    enum:
      - synthetic
      - mock
      - none
  dataStoreConfigUUID:
    type: string
    x-faker: datatype.uuid
  policy:
    $ref: ./DatumPolicy.yaml
  workspaces:
    type: array
    description: List of workspaces associated with this data
    items:
      $ref: ./SimpleWorkspace.yaml
required:
  - uuid
  - name
  - datasetPath
  - remoteUri
  - createdAt
  - createdBy
  - columns
  - dataSource
  - description
  - size
  - testDataType
  - dataStoreConfigUUID
